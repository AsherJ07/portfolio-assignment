substitutions:
  _REGION: us-central1
  _SERVICE: portfolio
  _AR_IMAGE: cloud-run-source-deploy/asherj07-portfolio-assignment/portfolio
  _SITE_URL: https://portfolio-1033708826767.us-central1.run.app

steps:
  - id: quality-gates
    name: node:22.16.0-alpine
    entrypoint: sh
    args:
      - -c
      - npm ci && npm run lint && npm run typecheck && npm test -- --run && npm run build

  - id: build-container
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_IMAGE}:$COMMIT_SHA
      - .

  - id: push-container
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_IMAGE}:$COMMIT_SHA

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --update-labels
      - commit-sha=$COMMIT_SHA,managed-by=cloud-build
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_IMAGE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
